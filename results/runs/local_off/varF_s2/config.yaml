experiment: b7_encoding
label: varF_enc_off_s2
data: data/release_train
eval_data: data/unseen_cables_test
train:
  steps: 100000
  batch_size: 512
  sigma: 0.1
  lr: 0.001
  lr_final: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  seed: 2
  eval_every: 500
  eval_batches: 32
  device: cuda
  history_frames: 70
  param_encoding: designed
variant: F
model:
  d_model: 128
  n_heads: 8
  n_layers: 4
  dropout: 0.0
  attn_dropout: 0.0
  use_global: true
  use_local: false
  arch: gps
split:
  held_out_fraction: 0.0
  d_close_diameters: 1.5
  c_far_segments: 4
checkpoint_at: []
eval:
  stage: unseen_test
  limit: 400
  horizons:
  - 1
  - 10
  - 50
  - 100
  - 200
  - 400
  arms: model
  ballistic_cache: null
  require_tuning_root: false
plots:
  best_by: rel_l2_at_h200
results_root: results
save_preds: false
eval_unseen_data: null
