name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv run python scripts/make_tables.py --check
      - run: uv run python -m dlogps.harness.run_experiment --config_path configs/experiments/smoke.yaml --train.steps 20 --train.eval_every 10 --eval.limit 2
