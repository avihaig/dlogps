# Local stream OFF: identical to local_on.yaml except `model.use_local: false`
# (and the experiment name), so only dense global attention remains. One cell
# per run: `--variant {A,B,C,D,F} --train.seed {0,1,2}`, launched by
# scripts/train_matrix.sh --local off. tests/test_run_experiment.py enforces
# that the two files differ in exactly that key.
experiment: local_off
label: varA_s0
data: data/release_train
eval_data: data/unseen_cables_test
variant: A
results_root: results
save_preds: false

train:
  steps: 100000
  batch_size: 512
  sigma: 0.1
  lr: 0.001
  lr_final: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  seed: 0
  eval_every: 500
  eval_batches: 32
  device: cuda
  history_frames: 70
  param_encoding: designed

model:
  d_model: 128
  n_heads: 8
  n_layers: 4
  dropout: 0.0
  attn_dropout: 0.0
  use_global: true
  use_local: false

split:
  held_out_fraction: 0.0
  d_close_diameters: 1.5
  c_far_segments: 4

# Only the final checkpoint is reported, so no mid-run snapshots are taken; the
# runner always writes and scores step 100000.
checkpoint_at: []

eval:
  stage: unseen_test
  limit: 400
  horizons: [1, 10, 50, 100, 200, 400]
  arms: model

plots:
  best_by: rel_l2_at_h200

